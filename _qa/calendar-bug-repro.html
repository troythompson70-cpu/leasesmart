<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Calendar Bug Repro — v1.1.4 broken behavior</title>
<style>
body{font-family:system-ui,sans-serif;padding:24px;max-width:560px;margin:0 auto}
.panel{border:2px solid #e5e7eb;border-radius:16px;padding:24px;margin-bottom:16px}
.bad{background:#fef2f2;border-color:#fca5a5}
.ok{background:#f0fdf4;border-color:#86efac}
label{display:block;font-weight:700;margin-bottom:8px}
input[type=date]{font-size:16px;padding:12px;width:100%;margin-bottom:12px}
button{padding:12px 16px;font-size:16px;font-weight:700;border:none;border-radius:8px;background:#d1d5db;color:#6b7280;width:100%;cursor:not-allowed}
button.enabled{background:#22d98a;color:#000;cursor:pointer}
#log{font-family:monospace;font-size:13px;white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:16px;border-radius:8px;min-height:120px}
</style>
</head>
<body>
<h1>Calendar Bug Repro (v1.1.4 logic)</h1>
<p>Simulates move-in step <strong>4 of 21</strong> with broken auto-advance on date <code>change</code>/<code>input</code>.</p>

<div class="panel" id="stepPanel">
  <div id="stepLabel">Step 4 of 21 — Move-in date</div>
  <label for="qCalendar">When do you need to move in?</label>
  <input type="date" id="qCalendar" min="2026-05-22"/>
  <button id="qNextBtn" disabled>Continue →</button>
</div>

<div id="log"></div>

<script>
var quizStep = 3;
var logEl = document.getElementById('log');
var stepPanel = document.getElementById('stepPanel');
var stepLabel = document.getElementById('stepLabel');

function log(msg) {
  logEl.textContent += new Date().toISOString().slice(11,19) + ' ' + msg + '\n';
}

function advance(val) {
  quizStep++;
  log('advance() called with: ' + val);
  log('AUTO-ADVANCED to step ' + (quizStep + 1) + ' (Search state) WITHOUT Continue click');
  stepPanel.className = 'panel bad';
  stepLabel.textContent = 'BUG: Jumped to Step 5 — Search state (auto-advanced)';
  document.getElementById('qCalendar').disabled = true;
}

// === BROKEN v1.1.4 wireStepEvents calendar block ===
var cal = document.getElementById('qCalendar');
var btn = document.getElementById('qNextBtn');
var calDone = false;
function formatCal(iso) {
  var p = iso.split('-');
  return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10))
    .toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}
function submitCal() {
  if (calDone || !cal || !cal.value) return;
  calDone = true;
  advance(formatCal(cal.value));
}
if (cal) {
  cal.addEventListener('change', submitCal);
  cal.addEventListener('input', submitCal);
}
if (btn) btn.addEventListener('click', function() {
  if (!cal || !cal.value) return;
  submitCal();
});

log('Ready — set date via automation to trigger bug');
</script>
</body>
</html>
